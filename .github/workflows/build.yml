name: Verify and release VLC Player

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Nội dung thay đổi; để trống để lấy các commit mới'
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Test release metadata and publication checks
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Lint, test and build debug APK
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vlcplayer-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    concurrency:
      group: vlcplayer-signed-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > vlcplayer.keystore
      - name: Generate app version
        id: version
        run: |
          echo "code=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "name=$(date +%Y.%m.%d.%H%M)" >> "$GITHUB_OUTPUT"
      - name: Build signed release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          KEYSTORE_PATH: ${{ github.workspace }}/vlcplayer.keystore
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      - name: Verify signed APK and create updater metadata
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          python3 scripts/create_update_manifest.py \
            --apk app/build/outputs/apk/release/app-release.apk \
            --aapt "$ANDROID_HOME/build-tools/34.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/34.0.0/apksigner" \
            --version-code "$VERSION_CODE" --version-name "$VERSION_NAME" \
            --commit "$RELEASE_COMMIT" --notes-file release-notes.md \
            --output app/build/outputs/apk/release/update.json
      - name: Upload and verify draft assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          python3 scripts/publish_update_release.py \
            --apk app/build/outputs/apk/release/app-release.apk \
            --manifest app/build/outputs/apk/release/update.json \
            --notes-file release-notes.md --commit "$RELEASE_COMMIT"
